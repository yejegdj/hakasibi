plugins { id 'com.android.application' }
android {
  namespace 'com.example.qwentouch'
  compileSdk 35
  defaultConfig {
    applicationId 'com.example.qwentouch'
    minSdk 30
    targetSdk 35
    versionCode 2
    versionName '0.2.0'
  }
  flavorDimensions 'mode'
  productFlavors {
    safe {
      dimension 'mode'
      applicationIdSuffix '.safe'
      versionNameSuffix '-safe'
    }
    advanced {
      dimension 'mode'
      versionNameSuffix '-advanced'
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
